name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Thin caller for the canonical reusable release pipeline in the public
# WYRE-AI/reusable-workflows repo: verify → semantic-release → Docker push of
# ghcr.io/wyre-ai/ncentral-mcp:vX.Y.Z (+ :latest) → MCP Registry publish of
# server.json stamped with that exact tag → Trivy scan. On pull_request only
# the reusable's verify job runs; typecheck and the Node version matrix live
# in ci.yml.
#
# Pin: keep this on a reusable-workflows SHA whose mcp-registry job is not
# gated on repository visibility (see WYRE-AI/reusable-workflows#3).
#
# Caller jobs grant the token scopes the reusable jobs request (a reusable can
# only reduce, never expand, caller-granted scope).
jobs:
  release:
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
      id-token: write
      security-events: write
    uses: WYRE-AI/reusable-workflows/.github/workflows/mcp-server-release.yml@fbc1e9864c3c591f0d76c46b1de750489614fe0b
    with:
      server-name: ncentral-mcp
      image-name: ghcr.io/wyre-ai/ncentral-mcp
    secrets: inherit
